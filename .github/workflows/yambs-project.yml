---
name: Yambs Project

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  GITHUB_API_TOKEN: ${{secrets.API_TOKEN}}
  CODECOV_TOKEN: ${{secrets.CODECOV_TOKEN}}

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: [3.13]

    env:
      PYTHON_VERSION: ${{matrix.python-version}}

    steps:
      - uses: actions/checkout@master
        with:
          submodules: recursive

      - uses: seanmiddleditch/gha-setup-ninja@master

      - name: python${{matrix.python-version}} setup
        uses: actions/setup-python@main
        with:
          python-version: ${{matrix.python-version}}
          cache: pip

      - run: pip${{matrix.python-version}} install vmklib>=2.0.7 yambs>=3.1.1 ifgen>=4.4.3

      - run: mk --version
      - run: mbs --version
      - run: ig --version

      - run: mk dz-sync

      - run: mk yaml
      - run: mk python-lint
      - run: mk python-sa

      # - name: setup clang 19
      #   run: |
      #     wget https://apt.llvm.org/llvm.sh
      #     chmod +x ./llvm.sh
      #     sudo ./llvm.sh 19
      #     rm llvm.sh
      - run: sudo apt-get install doxygen clang-format-19
      - run: mk download-toolchains
      - run: mk g
      - run: ninja all format-check
      - run: mk dist variant=picolibc-semihost
        if: github.ref_name != 'master'

      - run: mk release variant=picolibc-semihost
        if: |
          env.GITHUB_API_TOKEN != ''
          && github.ref_name == 'master'
